<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><radialGradient id="glowLeft" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="glowRight" cx="80%" cy="70%" r="50%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".2"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.1) translate(20px,-10px);opacity:.5}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes floatPillDelayed{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.pulsing-glow{animation:pulseOrb 8s ease-in-out infinite}.flowing-path{stroke-dasharray:8 6;animation:dashFlow 2.5s linear infinite}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPillDelayed 6s ease-in-out infinite 1s}.pill-3{animation:floatPill 5.5s ease-in-out infinite .5s}.pill-4{animation:floatPillDelayed 6.5s ease-in-out infinite 1.5s}</style><rect width="1200" height="360" fill="url(#bgGrad)"