<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.1) translate(20px, -10px); opacity: 0.5; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatPillDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .pulsing-glow {
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .flowing-path {
      stroke-dasharray: 8 6;
      animation: dashFlow 2.5s linear infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillDelayed 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 0.5s; }
    .pill-4 { animation: floatPillDelayed 6.5s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="240" cy="120" r="180" fill="url(#glowLeft)" class="pulsing-glow" />
  <circle cx="980" cy="220" r="220" fill="url(#glowRight)" class="pulsing-glow" />

  <!-- Animated Connection Flows (Background Layer) -->
  <path d="M 120 280 C 350 320, 480 260, 620 290 C 760 320, 950 260, 1100 290" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" class="flowing-path" />
  <path d="M 150 90 C 380 50, 520 110, 720 70 C 880 40, 1020 90, 1120 70" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="2" class="flowing-path" />

  <!-- Decorative Modern Badges / Feature Cards in Flow -->
  <g class="pill-1" transform="translate(180, 55)">
    <rect width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" backdrop-filter="blur(4px)" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">SaaS Discovery</text>
  </g>

  <g class="pill-2" transform="translate(860, 50)">
    <rect width="160" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.2" backdrop-filter="blur(4px)" />
    <circle cx="18" cy="17" r="4" fill="#c084fc" />
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">IAM &amp; SSO Security</text>
  </g>

  <g class="pill-3" transform="translate(140, 275)">
    <rect width="165" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2" backdrop-filter="blur(4px)" />
    <circle cx="18" cy="17" r="4" fill="#818cf8" />
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">License Optimization</text>
  </g>

  <g class="pill-4" transform="translate(890, 270)">
    <rect width="150" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" backdrop-filter="blur(4px)" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Multi-Cloud Audit</text>
  </g>

  <!-- Central Foreground Content (Title & Subtitle Unobscured) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Super Title Tag -->
    <rect x="-140" y="-36" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="0" y="-18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE IT &amp; CLOUD OPS</text>

    <!-- Main Title with Gradient -->
    <text x="0" y="32" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Awesome Cloud Administration</text>

    <!-- Subtitle Description -->
    <text x="0" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Curated SaaS Platforms, Self-Hosted IAM, Tenant Governance &amp; Shadow IT Tooling</text>
  </g>
</svg>
